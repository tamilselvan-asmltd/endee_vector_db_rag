version: '3.8'

services:
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - endee_data:/app/data

  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres-agent:
    image: postgres:16-alpine
    container_name: postgres-agent-memory
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - postgres_agent_data:/var/lib/postgresql/data
    profiles:
      - agent
      - full

volumes:
  endee_data:
  redis_data:
  postgres_agent_data: